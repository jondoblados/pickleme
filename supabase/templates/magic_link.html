<!-- Supabase Auth → Email Templates → "Magic Link".
     Subject: Your PickleMe sign-in link
     The link opens PickleMe (jon.doblados.net/pickleme); the app then verifies the token with Supabase. -->
<!doctype html><html><body style="margin:0;background:#f5f2ea">
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;padding:24px;color:#15211b">
  <div style="background:#14382b;color:#ffffff;border-radius:14px;padding:22px 24px">
    <p style="margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#cfe0d6">Sign in</p>
    <h1 style="margin:0;font-size:24px;line-height:1.2">Your PickleMe sign-in link.</h1>
    <p style="margin:10px 0 0;color:#cfe0d6">Tap the button to sign in as <strong style="color:#d9f24a">{{ .Email }}</strong> and get back to your game.</p>
  </div>
  <p style="margin:22px 0 22px"><a href="{{ .RedirectTo }}&auth=confirm&token_hash={{ .TokenHash }}&type=email" style="background:#14382b;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:bold;display:inline-block">Sign in to PickleMe</a></p>
  <p style="margin:16px 0 0;font-size:12px;color:#5a675f">This link works once and expires in 1 hour. If you didn't ask to sign in, you can ignore this email.<br>PickleMe · pickleball game sign-ups · jon.doblados.net/pickleme</p>
</div></body></html>
